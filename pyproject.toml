[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9,<0.10"]

[dependency-groups]
dev = [
  "coverage",
  "django-cors-headers>=3.11.0",
  "django-debug-toolbar>=1.11",
  "django-silk",
  "ipdb",
  "ipython",
  "polars>=1.41.2",
  "pudb",
  "ruff",
  "toml-sort>=0.23.1",
  "werkzeug==0.16.1"
]
docs = [
  "mkdocs",
  "mkdocs-bootswatch",
  "mkdocs-material",
  "mkdocs_bootstrap"
]
prod = [
  "gunicorn==23.0.0"
]
test = [
  "coverage",
  "coveralls",
  "ddt",
  "mock==4.0.2",
  "sphinx"
]

[project]
authors = [
  {email = "opensource@allegro.pl", name = "Allegro.pl Sp. z o.o. and Contributors"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Operating System :: POSIX",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP"
]
dependencies = [
  "Babel==2.11.0",
  "Faker==0.9.0",
  "Markdown==3.2.1",
  "Unidecode==0.04.18",
  "cmd2==2.7.0",
  "debtcollector>=2.2",
  "django-auth-ldap~=2.0",
  "django-cryptography-django5",
  "django-extensions==3.1.5",
  "django-filter==25.1",
  "django-import-export==4.0.2",
  "django-money==3.4.1",
  "django-mptt==0.14",
  "django-prometheus==2.2.0",
  "django-redis==5.0.0",
  "django-reversion~=4.0.2",
  "django-rq==2.8.0",
  "django-sitetree==1.18.0",
  "django-taggit",
  "django-threadlocals==0.8",
  "djangorestframework==3.15.0",
  "djangorestframework_xml==2.0.0",
  "django~=4.2.0",
  "dogpile-cache==1.3.4",
  "drf-nested-routers==0.92.5",
  "factory-boy==3.2.1",
  "hiredis==3.2.1",
  "iso8601==0.1.11",
  "keystoneauth1",
  "mysqlclient~=2.2",
  "netaddr==0.10.1",
  "netifaces",
  "odfpy>=1.4.1",
  "openpyxl",
  "openstacksdk==1.5.0",
  "oslo.config==9.7.1",
  "oslo.i18n==6.5.1",
  "oslo.serialization==5.7.0",
  "oslo.utils==8.2.0",
  "pbr==6.1.1",
  "pillow==11.3.0",
  "prettytable>=3.9",
  "psycopg[binary,pool]>=3.2.10",
  "pydantic>=2.13.4",
  "pyhermes~=0.6.0",
  "python-dateutil==2.9.0",
  "python-glanceclient",
  "python-ironicclient==5.12.0",
  "python-keystoneclient==5.6.0",
  "python-ldap==3.4.4",
  "python-novaclient",
  "pytz==2025.1",
  "raven",
  "redis~=4.0",
  "requests-oauthlib==1.3.0",
  "requests==2.32.4",
  "rq==1.16.2",
  # kept unpinned for third-party libs that still import pkg_resources at runtime
  "setuptools>=68",
  "simplejson>=3.19",
  "six==1.16.0",
  "social-auth-app-django>=5.4.3",
  "statsd<4.0.0",
  "stevedore",
  "tblib>=3.1.0",
  "wrapt>=1.16"
]
description = "Advanced Asset Management and DCIM system for data center and back office."
license = "Apache-2.0"
name = "ralph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "3.0.0"

[project.entry-points."account.views.get_asset_list_class"]
default = "ralph.accounts.views:get_asset_list_class"

[project.entry-points."back_office.transition_action.email_context"]
default = "ralph.back_office.helpers:get_email_context_for_transition"

[project.entry-points."ralph.cloud_sync_processors"]
noop = "ralph.virtual.processors.noop:endpoint"

[project.scripts]
dev_ralph = "ralph.__main__:dev"
ralph = "ralph.__main__:prod"
test_ralph = "ralph.__main__:test"
validate_ralph = "ralph.cross_validator.__main__:main"

[project.urls]
Homepage = "http://ralph.allegrogroup.com/"

[tool.ruff]
exclude = [
  "*local.py",
  "*migrations*"
]
indent-width = 4
line-length = 99

[tool.ruff.lint]
ignore = []
select = ["B", "B9", "E", "F", "W"]

[tool.uv]
default-groups = ["dev", "prod", "test"]

[tool.uv.build-backend]
module-name = "ralph"

[tools.ruff.format]
line-ending = "auto"
