[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9,<0.10"]

[dependency-groups]
dev = [
  "coverage",
  "django-cors-headers>=3.11.0",
  "django-debug-toolbar>=1.11",
  "django-silk",
  "ipdb",
  "ipython",
  "polars>=1.41.2",
  "pudb",
  "ruff",
  "toml-sort>=0.23.1",
  "werkzeug==0.16.1"
]
docs = [
  "mkdocs",
  "mkdocs-bootswatch",
  "mkdocs-material",
  "mkdocs_bootstrap"
]
prod = [
  "gunicorn==23.0.0"
]
test = [
  "coverage",
  "coveralls",
  "ddt",
  "mock==4.0.2",
  "sphinx"
]

[project]
authors = [
  {email = "opensource@allegro.pl", name = "Allegro.pl Sp. z o.o. and Contributors"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python",
  "Topic :: Internet :: WWW/HTTP"
]
dependencies = [
  "babel==2.18.0",
  "cmd2==4.2.1",
  "debtcollector>=2.2",
  "django-auth-ldap~=5.3",
  "django-cryptography-django5",
  "django-extensions==4.1",
  "django-filter==26.1",
  "django-import-export==4.4.1",
  "django-money==3.6.1",
  "django-mptt==0.18.0",
  "django-prometheus==2.4.0",
  "django-redis==7.0.0",
  "django-reversion~=6.3.0",
  "django-rq==4.1.1",
  "django-sitetree==1.18.1",
  "django-taggit",
  "django-threadlocals==0.10",
  "djangorestframework==3.18.0",
  "djangorestframework_xml==2.0.0",
  "django~=6.1.0",
  "dogpile-cache==1.5.0",
  "drf-nested-routers==0.95.3",
  "factory-boy==3.3.3",
  "faker==40.37.0",
  "hiredis==3.4.1",
  "iso8601==2.1.0",
  "keystoneauth1",
  "markdown==3.10.3",
  "mysqlclient~=2.2",
  "netaddr==1.3.0",
  "netifaces",
  "odfpy>=1.4.1",
  "openpyxl",
  "openstacksdk==4.18.0",
  "oslo-config==10.7.0",
  "oslo-i18n==6.9.0",
  "oslo-serialization==5.11.0",
  "oslo-utils==10.2.0",
  "pbr==7.1.1",
  "pillow==12.3.0",
  "prettytable>=3.9",
  "psycopg[binary,pool]>=3.2.10",
  "pydantic>=2.13.4",
  "pyhermes~=0.7.1",
  "python-dateutil==2.9.0.post0",
  "python-glanceclient",
  "python-ironicclient==6.2.0",
  "python-keystoneclient==5.8.0",
  "python-ldap==3.4.7",
  "python-novaclient",
  "pytz==2026.3.post1",
  "raven",
  "redis~=8.1",
  "requests-oauthlib==2.0.0",
  "requests==2.34.2",
  "rq==2.11.0",
  # kept unpinned for third-party libs that still import pkg_resources at runtime
  "setuptools>=68",
  "simplejson>=3.19",
  "social-auth-app-django>=5.4.3",
  "statsd<4.0.2",
  "stevedore",
  "tblib>=3.1.0",
  "unidecode==1.4.0",
  "wrapt>=1.16"
]
description = "Advanced Asset Management and DCIM system for data center and back office."
license = "Apache-2.0"
name = "ralph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "3.0.0"

[project.entry-points."account.views.get_asset_list_class"]
default = "ralph.accounts.views:get_asset_list_class"

[project.entry-points."back_office.transition_action.email_context"]
default = "ralph.back_office.helpers:get_email_context_for_transition"

[project.entry-points."ralph.cloud_sync_processors"]
noop = "ralph.virtual.processors.noop:endpoint"

[project.scripts]
dev_ralph = "ralph.__main__:dev"
ralph = "ralph.__main__:prod"
test_ralph = "ralph.__main__:test"
validate_ralph = "ralph.cross_validator.__main__:main"

[project.urls]
Homepage = "http://ralph.allegrogroup.com/"

[tool.ruff]
exclude = [
  "*local.py",
  "*migrations*"
]
indent-width = 4
line-length = 99

[tool.ruff.lint]
ignore = []
select = ["B", "B9", "E", "F", "W"]

[tool.uv]
default-groups = ["dev", "prod", "test"]

[tool.uv.build-backend]
module-name = "ralph"

[tools.ruff.format]
line-ending = "auto"
