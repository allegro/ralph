# SonarQube configuration for the SE3002 SQE project (Ralph baseline).
sonar.projectKey=sqe-ralph
sonar.projectName=SQE Ralph (licences workflows)
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

# Whole server-side code base is analysed for the metrics report.
sonar.sources=src/ralph
sonar.exclusions=**/tests/**,**/migrations/**,src/ralph/static/**,src/ralph/js_tests/**

# Our team tests and their coverage (generated by: coverage xml in tests/team).
sonar.tests=tests/team
sonar.python.coverage.reportPaths=tests/team/coverage.xml

# Coverage is only meaningful for our business-logic scope; elsewhere it would
# read as 0% and hide the signal. See report section 4.3.
sonar.coverage.inclusions=src/ralph/licences/models.py,src/ralph/licences/api.py
