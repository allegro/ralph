[pytest]
DJANGO_SETTINGS_MODULE = ralph.settings.test
pythonpath = ../../src
testpaths = unit
addopts = -p no:cacheprovider --reuse-db
markers =
    br1: Business rule 1 - licence seat limit (boundary)
    br2: Business rule 2 - region decision (multi-condition)
    br3: Business rule 3 - asset status transition (state change)
    br4: Business rule 4 - no duplicate assignment / ownership preconditions
